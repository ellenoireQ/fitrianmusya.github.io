<ul class="social-media-list">
  {% if site.github_username %}
  <li>
    <a href="https://github.com/{{ site.github_username | cgi_escape | escape }}" title="GitHub">
      <svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#github"></use></svg>
      <span class="username">{{ site.github_username | escape }}</span>
    </a>
  </li>
  {% endif %}

  <li>
    <a href="https://www.linkedin.com/in/ahmad-fitrian-almusyafak-2ba102365" title="LinkedIn">
      <svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#linkedin"></use></svg>
      <span class="username">{{ site.linkedin_username | escape }}</span>
    </a>
  </li>

  {% if site.email %}
  <li>
    <a href="mailto:{{ site.email | escape }}" title="Email">
      <svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#email"></use></svg>
      <span class="username">{{ site.email | escape }}</span>
    </a>
  </li>
  {% endif %}

</ul>
