title: Fitrian Musya
author: Fitrian Musya
email: YOUR_EMAIL@example.com
description: > # this means to ignore newlines until "baseurl:"
  Personal website for Fitrian Musya. YOUR_SHORT_DESCRIPTION_HERE.

baseurl: ""
url: "https://fitrianmusya.github.io"

# social links
github_username:  ellenoireq
linkedin_username: Ahmad Fitrian Al Musyafak

disqus:
  shortname: YOUR_DISQUS_SHORTNAME

# google_analytics: YOUR_GA_TRACKING_ID

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

show_excerpts: false # set to true to show excerpts on the homepage

# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%b %-d, %Y"

# Pages shown in the header nav
header_pages:
  - about.md
  - index.md
  - research.md

# Build settings
markdown: kramdown
theme: minima
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
